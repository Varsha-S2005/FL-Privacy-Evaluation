[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-app"
version = "1.0.0"
description = "Federated Learning Privacy Evaluation"
requires-python = ">=3.11"
dependencies = [
    "flwr[simulation]==1.43.0",
    "torch",
    "numpy",
    "pandas",
    "pyarrow",
    "opacus==1.6.0"
]

[tool.hatch.build.targets.wheel]
packages = ["fl_app", "src"]


[tool.flwr.app]
publisher = "varsha"

[tool.flwr.app.components]
serverapp = "fl_app.server_app:app"
clientapp = "fl_app.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
fraction-train = 0.1
local-epochs = 2
batch-size = 32
learning-rate = 0.01


